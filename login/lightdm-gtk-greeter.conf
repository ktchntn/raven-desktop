# RAVEN login screen. Kali's original: /etc/lightdm/lightdm-gtk-greeter.conf.kali-backup
[greeter]
background = /usr/share/backgrounds/raven/login.png
user-background = false
theme-name = RAVEN
icon-theme-name = Papirus-Dark
font-name = Space Grotesk 11
cursor-theme-name = Bibata-Modern-Classic
cursor-theme-size = 24
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %a %-d %b  ·  %-I:%M %p
hide-user-image = true
round-user-image = false
position = 50%,center 50%,center
screensaver-timeout = 60
keyboard = onboard
