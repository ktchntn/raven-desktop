# RAVEN lock screen (⌘K): matches the LightDM login screen. A dimmed copy of the
# wallpaper (made by raven-wallpaper), a black rounded box with a grey hairline, the
# dot-matrix clock and date, and a password field that lights up lime.
general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = @HOME@/.local/state/raven/lock.png
    color = rgb(000000)
}

# The box, as on the login screen
shape {
    monitor =
    size = 420, 280
    color = rgb(000000)
    rounding = 22
    border_size = 1
    border_color = rgb(2A2A2A)
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%-I:%M %p'
    font_family = Doto Black
    font_size = 52
    color = rgb(F2F2F2)
    position = 0, 78
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B'
    font_family = Space Mono
    font_size = 12
    color = rgb(A3A3A3)
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.65
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    outer_color = rgb(2A2A2A)
    inner_color = rgb(0E0E0E)
    font_color = rgb(F2F2F2)
    check_color = rgb(C6FF00)
    fail_color = rgb(C6FF00)
    capslock_color = rgb(C6FF00)
    placeholder_text = <span font_family='Space Mono' foreground='##7A7A7A'>Password</span>
    fail_text = <span font_family='Space Mono'>Wrong password ($ATTEMPTS)</span>
    position = 0, -62
    halign = center
    valign = center
}

label {
    monitor =
    text = ●
    font_family = JetBrainsMono Nerd Font
    font_size = 8
    color = rgb(C6FF00)
    position = 0, 66
    halign = center
    valign = bottom
}

label {
    monitor =
    text = <i>nevermore</i>
    font_family = Space Mono
    font_size = 10
    color = rgb(333333)
    position = 0, 40
    halign = center
    valign = bottom
}
