<?xml version="1.0" encoding="UTF-8"?>
<!-- RAVEN: Warp in the style of Shade of Z - White (white tile, mark cut out in black). -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" ry="11" fill="#FFFFFF"/>
  <g stroke-linejoin="round">
    <!-- back panel -->
    <polygon points="28,17 50,17 43.5,39 21.5,39" fill="#000000" stroke="#000000" stroke-width="3"/>
    <!-- gap around the front panel, then the front panel -->
    <polygon points="20.5,25 42.5,25 36,47 14,47" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    <polygon points="20.5,25 42.5,25 36,47 14,47" fill="#000000" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
