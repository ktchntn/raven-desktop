# RAVEN (after NIHIL by poligle)
font_family      JetBrainsMono Nerd Font
font_size        11
confirm_os_window_close 0
window_padding_width 12
cursor_shape block
cursor_blink_interval 0
tab_bar_style fade
tab_fade 1
active_tab_font_style bold
inactive_tab_font_style bold
dynamic_background_opacity yes
enable_audio_bell no

background #000000
foreground #E6E6E6
cursor #C6FF00
cursor_text_color #000000
selection_background #C6FF00
selection_foreground #000000
url_color #C6FF00
active_border_color #7A7A7A
inactive_border_color #2A2A2A
active_tab_background #1A1A1A
active_tab_foreground #F2F2F2
inactive_tab_background #000000
inactive_tab_foreground #7A7A7A

color0  #000000
color8  #5E5E5E
color1  #C6FF00
color9  #C6FF00
color2  #9E9E9E
color10 #9E9E9E
color3  #FFFFFF
color11 #FFFFFF
color4  #F2F2F2
color12 #F2F2F2
color5  #B5B5B5
color13 #B5B5B5
color6  #8A8A8A
color14 #8A8A8A
color7  #E6E6E6
color15 #FFFFFF

map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard

# Smoked glass (raven-wallpaper glass on|off)
geninclude kitty-glass.sh
